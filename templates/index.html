<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fine Tuned Chat</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7ie1o+7FZfyypKJ6JrUe5h2v2moenAcI3BQ"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background-color: #343541;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff; overflow: hidden;
    }
    .app-container { display: flex; height: 100%; }
    .sidebar {
      width: 260px; background-color: #202123;
      display: flex; flex-direction: column; padding: 10px; box-sizing: border-box;
    }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px; margin-bottom: 10px;
    }
    .sidebar-header h2 {
      font-size: 1.2rem; margin: 0;
    }
    .new-chat-btn {
      width: 100%; background-color: #3e3f4b; color: #fff;
      border: none; padding: 10px; text-align: left;
      border-radius: 5px; margin-bottom: 15px; cursor: pointer;
      font-size: 0.95rem;
    }
    .new-chat-btn:hover { background-color: #4e4f5d; }
    .sidebar-item {
      background: transparent; border: none; color: #ffffffcc;
      text-align: left; padding: 10px; width: 100%;
      font-size: 0.95rem; border-radius: 5px;
      margin-bottom: 5px; cursor: pointer;
    }
    .sidebar-item:hover {
      background-color: #3e3f4b; color: #fff;
    }
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      background-color: #444654; overflow: hidden;
    }
    .prompt-bar {
      padding: 15px 20px; border-bottom: 1px solid #565869;
      display: flex; flex-wrap: wrap; gap: 10px;
      background-color: #343541;
    }
    .prompt-chip {
      background-color: #3e3f4b; color: #fff;
      border-radius: 20px; padding: 8px 16px;
      cursor: pointer; font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    .prompt-chip:hover { background-color: #4e4f5d; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box;
    }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-track { background: #2f3036; }
    .chat-messages::-webkit-scrollbar-thumb {
      background-color: #5e5e67; border-radius: 4px;
    }
    .message-container { display: flex; margin-bottom: 20px; width: 100%; }
    .message-avatar { margin-right: 10px; }
    .message-avatar img {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    }
    .message-bubble {
      max-width: 75%; border-radius: 8px; padding: 12px 16px;
      line-height: 1.4; white-space: pre-wrap; word-wrap: break-word;
      font-size: 0.95rem;
    }
    .bot .message-bubble {
      background-color: #40414f; color: #f2f2f2;
      border-bottom-left-radius: 0;
    }
    .user { flex-direction: row-reverse; }
    .user .message-bubble {
      background-color: #0b57d0; color: #fff;
      border-bottom-right-radius: 0;
    }
    .user .message-avatar { margin-left: 10px; margin-right: 0; }
    .chat-input {
      background-color: #343541; border-top: 1px solid #565869;
      padding: 15px 20px; display: flex; justify-content: center;
    }
    .chat-input .input-group {
      max-width: 900px; width: 100%; border-radius: 25px;
      overflow: hidden; background-color: #3e3f4b; display: flex;
      align-items: center;
    }
    .chat-input textarea {
      border: none; background: transparent; color: #fff;
      padding: 12px 15px; resize: none; width: 100%;
      outline: none; font-size: 0.95rem; height: 50px;
    }
    .chat-input textarea::placeholder { color: #b2b2b2; }
    .chat-input button {
      border: none; background-color: #0b57d0; color: #fff;
      padding: 10px 20px; cursor: pointer; border-left: 1px solid #565869;
      display: flex; align-items: center; gap: 5px;
    }
    .chat-input button:hover { background-color: #0a4cb8; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .chat-input .input-group { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Fine Tuned Chat</h2>
      </div>
      <button class="new-chat-btn">
        <i class="bi bi-plus-lg"></i> New Chat
      </button>
      <button class="sidebar-item">Ice Melt Overview</button>
      <button class="sidebar-item">Natural Cycle Factors</button>
      <button class="sidebar-item">Recent Research</button>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <!-- Prompt Bar -->
      <div class="prompt-bar">
        <div class="prompt-chip" data-prompt="Why is Antarctic ice melting?">Why is Antarctic ice melting?</div>
        <div class="prompt-chip" data-prompt="Explain seasonal refreeze cycles">Explain seasonal refreeze cycles</div>
        <div class="prompt-chip" data-prompt="Evidence for global warming impact">Evidence for global warming impact</div>
        <div class="prompt-chip" data-prompt="Summarize latest papers">Summarize latest papers</div>
      </div>

      <!-- Messages -->
      <div id="chat-messages" class="chat-messages">
        <div class="message-container bot">
          <div class="message-avatar">
            <img src="https://placehold.co/40x40?text=B" alt="Bot Avatar"/>
          </div>
          <div class="message-bubble">
            Hello! I’m your Fine-Tuned Chat assistant. Ask me anything about Antarctic ice data.
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="chat-input">
        <div class="input-group">
          <textarea
            id="user-query"
            rows="1"
            placeholder="Type your message here..."
          ></textarea>
          <button id="send-btn">
            <i class="bi bi-send-fill"></i>
            Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoH5jCFJfQOFeC8xS2GoyX1E0xLy0fY4Rl6e8r9b2e1UQw/"
    crossorigin="anonymous">
  </script>

  <script>
    const sendButton = document.getElementById('send-btn');
    const userQueryInput = document.getElementById('user-query');
    const chatMessages = document.getElementById('chat-messages');
    const promptChips = document.querySelectorAll('.prompt-chip');

    function createMessageBubble(text, sender = 'bot') {
      const container = document.createElement('div');
      container.classList.add('message-container', sender);
      const avatar = document.createElement('div');
      avatar.classList.add('message-avatar');
      const img = document.createElement('img');
      img.src = sender === 'user'
        ? 'https://placehold.co/40x40?text=U'
        : 'https://placehold.co/40x40?text=B';
      avatar.appendChild(img);
      const bubble = document.createElement('div');
      bubble.classList.add('message-bubble');
      bubble.textContent = text;
      container.appendChild(avatar);
      container.appendChild(bubble);
      return container;
    }

    function appendMessage(text, sender) {
      const msg = createMessageBubble(text, sender);
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const query = userQueryInput.value.trim();
      if (!query) return;
      appendMessage(query, 'user');
      userQueryInput.value = '';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_query: query })
        });
        const data = await res.json();
        appendMessage(data.answer, 'bot');
      } catch {
        appendMessage('Sorry, something went wrong.', 'bot');
      }
    }

    sendButton.addEventListener('click', sendMessage);
    userQueryInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    promptChips.forEach(chip => {
      chip.addEventListener('click', () => {
        userQueryInput.value = chip.dataset.prompt;
        userQueryInput.focus();
      });
    });
  </script>
</body>
</html>
